    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" stroke-width="0.8"/>
    <polygon points="0,-78 67.5,-39 67.5,39 0,78 -67.5,39 -67.5,-39" stroke-width="0.8"/>
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" stroke-width="0.8"/>
