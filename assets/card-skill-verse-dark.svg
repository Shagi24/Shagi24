<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Courier New',monospace; }
    </style>
    <linearGradient id="bg-sv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13111a"/>
      <stop offset="100%" style="stop-color:#1a1425"/>
    </linearGradient>
  </defs>
  <rect width="420" height="160" rx="10" fill="url(#bg-sv)"/>
  <rect width="420" height="160" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="420" height="3" rx="1" fill="#7c3aed"/>

  <!-- repo name -->
  <text x="20" y="36" class="mono" font-size="16" font-weight="bold" fill="#ede9fe">Skill-Verse</text>

  <!-- language dot -->
  <circle cx="20" cy="54" r="5" fill="#f7df1e"/>
  <text x="32" y="59" class="mono" font-size="11" fill="#9ca3af">JavaScript</text>

  <!-- description -->
  <text x="20" y="82" class="mono" font-size="11" fill="#c4b5fd">Peer-to-peer skill sharing platform.</text>
  <text x="20" y="97" class="mono" font-size="11" fill="#c4b5fd">React Native · Expo · Firebase</text>

  <!-- stats -->
  <text x="20" y="130" class="mono" font-size="11" fill="#6d28d9">★  0</text>
  <text x="70" y="130" class="mono" font-size="11" fill="#6d28d9">⑂  0</text>

  <!-- link arrow -->
  <text x="390" y="130" class="mono" font-size="13" fill="#7c3aed" text-anchor="end">→</text>
</svg>
